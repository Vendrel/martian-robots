<!DOCTYPE html>
<html lang="hu"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Holographic Sci-Fi Reticle</title>

<style>
	* {
		box-sizing: border-box;
	}

	html,
	body {
		width: 100%;
		height: 100%;
		margin: 0;
	}

	body {
		display: grid;
		place-items: center;

		background:
			radial-gradient(
				circle at center,
				#07151c 0%,
				#03090d 45%,
				#010305 100%
			);

		overflow: hidden;
	}


	/* ==========================================================
	   MAIN RETICLE
	   ========================================================== */

	.reticle {
		position: relative;

		width: 375px;
		height: 375px;

		filter:
			drop-shadow(0 0 4px rgba(0, 255, 255, .45))
			drop-shadow(0 0 15px rgba(0, 220, 255, .16));

		animation: hologramPulse 4s ease-in-out infinite;
	}




	/* ==========================================================
	   GENERIC ROTATING LAYER
	   ========================================================== */

	.layer {
		position: absolute;

		top: 50%;
		left: 50%;

		width: var(--size);
		height: var(--size);

		transform:
			translate(-50%, -50%)
			rotate(0deg);

		border-radius: 50%;

		animation:
			rotateLayer var(--speed) linear infinite;

		opacity: var(--opacity, 1);
	}

	.reverse {
		animation-direction: reverse;
	}


	/* ==========================================================
	   ARC SYSTEM
	   ========================================================== */

	.arc {
		position: absolute;
		inset: 0;

		border-radius: 50%;

		background:
			conic-gradient(
				from var(--start),

				transparent 0deg,

				transparent 10deg,

				rgba(65, 255, 255, .15) 11deg,

				rgba(70, 255, 255, 1) 13deg,

				rgba(0, 230, 255, .92) var(--arc),

				rgba(0, 210, 255, .12)
				calc(var(--arc) + 2deg),

				transparent
				calc(var(--arc) + 5deg),

				transparent 360deg
			);

		-webkit-mask:
			radial-gradient(
				farthest-side,
				transparent calc(100% - var(--thickness)),
				#000 calc(100% - var(--thickness) + 1px)
			);

		mask:
			radial-gradient(
				farthest-side,
				transparent calc(100% - var(--thickness)),
				#000 calc(100% - var(--thickness) + 1px)
			);

		filter:
			drop-shadow(0 0 3px cyan)
			drop-shadow(0 0 8px rgba(0,255,255,.45));
	}


	/* ==========================================================
	   LAYERS
	   ========================================================== */

	.layer-1 {
		--size: 375px;
		--speed: 19s;
		--opacity: .65;
	}

	.layer-2 {
		--size: 330px;
		--speed: 12s;
		--opacity: .9;
	}

	.layer-3 {
		--size: 278px;
		--speed: 7s;
		--opacity: .8;
	}

	.layer-4 {
		--size: 225px;
		--speed: 15s;
		--opacity: .95;
	}

	.layer-5 {
		--size: 168px;
		--speed: 5s;
		--opacity: .85;
	}

	.layer-6 {
		--size: 112px;
		--speed: 9s;
		--opacity: .95;
	}


	/* ==========================================================
	   STATIC RINGS
	   ========================================================== */

	.thin-ring {
		position: absolute;

		top: 50%;
		left: 50%;

		width: var(--size);
		height: var(--size);

		transform: translate(-50%, -50%);

		border-radius: 50%;

		border:
			1px solid rgba(0, 240, 255, .18);

		box-shadow:
			inset 0 0 7px rgba(0,255,255,.07),
			0 0 6px rgba(0,255,255,.06);
	}

	.ring-a {
		--size: 350px;
	}

	.ring-b {
		--size: 247px;
	}

	.ring-c {
		--size: 142px;
	}


	/* ==========================================================
	   RADIAL TICKS
	   ========================================================== */

	.ticks {
		position: absolute;

		top: 50%;
		left: 50%;

		width: 305px;
		height: 305px;

		transform:
			translate(-50%, -50%);

		border-radius: 50%;

		background:
			repeating-conic-gradient(
				rgba(40, 250, 255, .62) 0deg 1deg,
				transparent 1deg 9deg
			);

		-webkit-mask:
			radial-gradient(
				circle,
				transparent 68%,
				#000 69% 73%,
				transparent 74%
			);

		mask:
			radial-gradient(
				circle,
				transparent 68%,
				#000 69% 73%,
				transparent 74%
			);

		opacity: .4;

		animation:
			rotateLayer 45s linear infinite reverse;
	}


	/* ==========================================================
	   CROSSHAIR
	   ========================================================== */

	.crosshair {
		position: absolute;

		top: 50%;
		left: 50%;

		width: 100%;
		height: 100%;

		transform:
			translate(-50%, -50%);

		opacity: .42;
	}

	.crosshair::before,
	.crosshair::after {
		content: "";

		position: absolute;

		background:
			linear-gradient(
				90deg,
				transparent,
				rgba(0,255,255,.2),
				rgba(0,255,255,.8),
				rgba(0,255,255,.2),
				transparent
			);

		box-shadow:
			0 0 5px rgba(0,255,255,.5);
	}

	.crosshair::before {
		top: 50%;
		left: 26%;

		width: 48%;
		height: 1px;
	}

	.crosshair::after {
		top: 26%;
		left: 50%;

		width: 1px;
		height: 48%;

		background:
			linear-gradient(
				180deg,
				transparent,
				rgba(0,255,255,.2),
				rgba(0,255,255,.8),
				rgba(0,255,255,.2),
				transparent
			);
	}


	/* ==========================================================
	   CENTER
	   ========================================================== */

	.center {
		position: absolute;

		top: 50%;
		left: 50%;

		width: 11px;
		height: 11px;

		transform:
			translate(-50%, -50%);

		border:
			1px solid rgba(90,255,255,.95);

		border-radius: 50%;

		background:
			radial-gradient(
				circle,
				#eaffff 0%,
				#32ffff 22%,
				rgba(0,255,255,.15) 55%,
				transparent 70%
			);

		box-shadow:
			0 0 4px cyan,
			0 0 10px cyan,
			0 0 24px rgba(0,255,255,.55);

		animation:
			centerPulse 1.7s ease-in-out infinite;
	}


	/* ==========================================================
	   DIAMOND LOCK
	   ========================================================== */

	.diamond {
		position: absolute;

		top: 50%;
		left: 50%;

		width: 42px;
		height: 42px;

		border:
			1px solid rgba(0,255,255,.28);

		transform:
			translate(-50%, -50%)
			rotate(45deg);

		animation:
			diamondSpin 10s linear infinite reverse;
	}


	/* ==========================================================
	   SCAN LINE
	   ========================================================== */

	.scan {
		position: absolute;

		top: 50%;
		left: 50%;

		width: 315px;
		height: 315px;

		transform:
			translate(-50%, -50%);

		border-radius: 50%;

		overflow: hidden;

		opacity: .2;

		-webkit-mask:
			radial-gradient(
				circle,
				#000 0 70%,
				transparent 98%
			);
	}

	.scan::after {
		content: "";

		position: absolute;

		left: 0;
		top: -20%;

		width: 100%;
		height: 18%;

		background:
			linear-gradient(
				to bottom,
				transparent,
				rgba(0,255,255,.28),
				transparent
			);

		filter: blur(2px);

		animation:
			scanMove 3.4s linear infinite;
	}


	/* ==========================================================
	   ANIMATIONS
	   ========================================================== */

	@keyframes rotateLayer {

		from {
			transform:
				translate(-50%, -50%)
				rotate(0deg);
		}

		to {
			transform:
				translate(-50%, -50%)
				rotate(360deg);
		}

	}


	@keyframes diamondSpin {

		from {
			transform:
				translate(-50%, -50%)
				rotate(45deg);
		}

		to {
			transform:
				translate(-50%, -50%)
				rotate(405deg);
		}

	}


	@keyframes hologramPulse {

		0%,
		100% {
			opacity: .86;
			filter:
				drop-shadow(0 0 4px rgba(0,255,255,.45))
				drop-shadow(0 0 15px rgba(0,220,255,.14));
		}

		50% {
			opacity: 1;
			filter:
				drop-shadow(0 0 7px rgba(0,255,255,.65))
				drop-shadow(0 0 23px rgba(0,220,255,.22));
		}

	}


	@keyframes coreGlow {

		0%,
		100% {
			opacity: .45;
			transform: scale(.93);
		}

		50% {
			opacity: 1;
			transform: scale(1.08);
		}

	}


	@keyframes centerPulse {

		0%,
		100% {
			transform:
				translate(-50%, -50%)
				scale(.8);
		}

		50% {
			transform:
				translate(-50%, -50%)
				scale(1.3);
		}

	}


	@keyframes scanMove {

		from {
			top: -20%;
		}

		to {
			top: 110%;
		}

	}

</style>

	<!-- subtle static circles -->

	<div class="thin-ring ring-a"></div>
	<div class="thin-ring ring-b"></div>
	


	<!-- outer slow arcs -->

	<div class="layer layer-1">
		<div class="arc" style="
				--start: 5deg;
				--arc: 58deg;
				--thickness: 3px;
			">
		</div>
	</div>


	<!-- outer-middle -->

	<div class="layer layer-2 reverse">

		<div class="arc" style="
				--start: 32deg;
				--arc: 92deg;
				--thickness: 2px;
			">
		</div>

	</div>


	<!-- segmented optical ticks -->

	<div class="ticks"></div>


	<!-- layer 3 -->

		<div class="arc" style="
				--start: 160deg;
				--arc: 39deg;
				--thickness: 4px;
			">
		</div>

	</div>


	<!-- layer 4 -->

	<div class="layer layer-4 reverse">

		<div class="arc" style="
				--start: 250deg;
				--arc: 105deg;
				--thickness: 2px;
			">
		</div>

	</div>


	<!-- layer 5 -->
